# Publication : pousser une étiquette `vX.Y.Z` (égale à la version de
# Cargo.toml) construit l'installateur et l'archive portable, puis crée la
# release GitHub avec les notes de CHANGELOG.md.
#
#   git tag v0.1.0
#   git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publication
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "L'étiquette ${{ github.ref_name }} ne correspond pas à la version $version de Cargo.toml."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --locked

      - name: Compilation (release)
        run: cargo build --release --locked

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installateur
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\atelier.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive portable
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folder = "target\atelier-$version-portable"
          New-Item -ItemType Directory -Force "$folder\data" | Out-Null
          Copy-Item target\release\atelier.exe, LICENSE, README.md $folder
          Copy-Item assets\fonts\OFL.txt "$folder\OFL-Geist.txt"
          # Le dossier `data` à côté de l'exécutable active le mode portable.
          "Les données d'Atelier sont rangées ici : mode portable." | Set-Content "$folder\data\LISEZMOI.txt" -Encoding utf8
          Compress-Archive -Path "$folder\*" -DestinationPath "target\atelier-$version-portable.zip" -Force

      - name: Empreintes et notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @("target\installer\atelier-$version-setup.exe", "target\atelier-$version-portable.zip")
          $files | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content target\SHA256SUMS.txt -Encoding ascii

          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($section.Success) { $section.Groups[1].Value.Trim() } else { "Atelier $version" }
          $notes | Set-Content target\notes.md -Encoding utf8

      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" `
            "target\installer\atelier-$version-setup.exe" `
            "target\atelier-$version-portable.zip" `
            "target\SHA256SUMS.txt" `
            --title "Atelier $version" `
            --notes-file target\notes.md
