name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Ce que vous avez fait, ce que vous attendiez, ce qui s'est produit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
  - type: input
    id: version
    attributes:
      label: Version d'Atelier
      description: Visible dans Réglages, carte « Modules ».
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Mode d'installation
      options:
        - Installateur
        - Archive portable
        - Compilé depuis les sources
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Journal
      description: Extrait de `atelier.log` (Réglages, bouton « Journal »). Relisez-le avant de le coller.
      render: text
